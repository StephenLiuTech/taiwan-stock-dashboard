[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "pams"
version = "0.2.0"
description = "Personal Asset Management System"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "pandas>=2.2,<3.0",
    "plotly>=5.24,<7.0",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.5,<3.0",
    "python-dotenv>=1.0,<2.0",
    "pyyaml>=6.0,<7.0",
    "streamlit>=1.40,<2.0",
]

[project.scripts]
pams = "pams.cli:main"

[project.optional-dependencies]
dev = [
    "black>=24.10,<26.0",
    "pytest>=8.3,<9.0",
    "ruff>=0.8,<1.0",
]

[tool.setuptools]
packages = [
    "config",
    "core",
    "database",
    "domain",
    "market_data",
    "market_calendar",
    "pams",
    "pams.application",
    "repositories",
    "services",
]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ANN"]
ignore = ["E501"] # Black cannot wrap SQL and other multiline string content.

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
